services:
  # =====================
  # Infrastructure
  # =====================
  postgres:
    image: postgres:16-alpine
    container_name: trading-agent-db
    environment:
      POSTGRES_DB: trading_agent
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d trading_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-net

  redis:
    image: redis:7-alpine
    container_name: trading-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading-net

  adminer:
    image: adminer:latest
    container_name: trading-agent-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      - postgres
    networks:
      - trading-net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: trading-agent-redis-ui
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379"
    depends_on:
      - redis
    networks:
      - trading-net

  # =====================
  # Backend Services
  # =====================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: trading-agent-litellm
    profiles:
      - full
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-local-dev}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    networks:
      - trading-net

  api:
    build:
      context: .
      dockerfile: ./api/business/Dockerfile
    container_name: trading-agent-api
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/trading_agent
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - NODE_ENV=production
      - VOLTAGENT_URL=http://voltagent:4001
      - BACKTEST_URL=http://backtest:8002
    depends_on:
      - postgres
      - redis
      - voltagent
    restart: unless-stopped
    networks:
      - trading-net

  market-data:
    build: ./services/market-data
    container_name: trading-agent-market-data
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/trading_agent
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - trading-net

  scheduler:
    build: ./services/scheduler
    container_name: trading-agent-scheduler
    ports:
      - "8001:8001"
    environment:
      - BACKEND_API_URL=http://api:4000
      - DATA_API_URL=http://market-data:8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - market-data
      - api
      - redis
    restart: unless-stopped
    networks:
      - trading-net

  voltagent:
    build:
      context: .
      dockerfile: ./services/agent/Dockerfile
    container_name: trading-agent-voltagent
    ports:
      - "4001:4001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MARKET_DATA_URL=http://market-data:8000
      - BACKEND_URL=http://api:4000
      - OPENAI_API_KEY=${DEEPSEEK_API_KEY:-sk-placeholder}
      - OPENAI_BASE_URL=http://litellm:4000
      - START_WORKER=true
    depends_on:
      - redis
      - market-data
    restart: unless-stopped
    networks:
      - trading-net

  backtest:
    build: ./services/backtest
    container_name: trading-agent-backtest
    ports:
      - "8002:8002"
    environment:
      - MARKET_DATA_URL=http://market-data:8000
    depends_on:
      - market-data
    restart: unless-stopped
    networks:
      - trading-net

  # =====================
  # Frontend
  # =====================
  web:
    build:
      context: .
      dockerfile: ./web/admin/Dockerfile
    container_name: trading-agent-web
    ports:
      - "3000:3000"
    environment:
      - NUXT_API_PROXY_TARGET=http://api:4000
      - NUXT_AGENT_PROXY_TARGET=http://voltagent:4001
      - NUXT_BACKTEST_PROXY_TARGET=http://backtest:8002
      - NUXT_PUBLIC_MARKET_DATA_API_BASE=http://market-data:8000
    depends_on:
      - api
      - market-data
      - voltagent
      - backtest
    restart: unless-stopped
    networks:
      - trading-net

networks:
  trading-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
